[tool.poetry]
name = "api-connections"
version = "0.1.0"
description = "Portfolio project: correlation across multiple external APIs"
authors = ["Szymon Turek"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web
flask = "^3.0.0"
flask-cors = "^4.0.0"
gunicorn = "^21.2.0"

# HTTP
requests = "^2.31.0"
python-dotenv = "^1.0.1"

# Data
pandas = "^2.2.0"
numpy = "^1.26.4"
scipy = "^1.12.0"

# Validation
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.1.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
api = "app.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"